name: PR

on:
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dipendenze di sistema
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      # Per i test dell'anteprima (non è in git).
      - name: Scarica pdfium
        run: sh scarica-pdfium.sh linux-x64
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
