name: PR

on:
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dipendenze di sistema
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - name: Cache pdfium (per i test anteprima)
        id: cache-pdfium
        uses: actions/cache@v4
        with:
          path: pdfium/
          # Allineata a VERSIONE in scarica-pdfium.sh.
          key: pdfium-7881-Linux
      - name: Scarica pdfium
        if: steps.cache-pdfium.outputs.cache-hit != 'true'
        run: sh scarica-pdfium.sh linux-x64
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
