name: CI

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - name: Cache pdfium (per i test anteprima)
        id: cache-pdfium
        uses: actions/cache@v4
        with:
          path: pdfium/
          # Allineata a VERSIONE in scarica-pdfium.sh.
          key: pdfium-7881-${{ runner.os }}
      - name: Scarica pdfium (Linux)
        if: runner.os == 'Linux' && steps.cache-pdfium.outputs.cache-hit != 'true'
        run: sh scarica-pdfium.sh linux-x64
      - name: Scarica pdfium (Windows)
        if: runner.os == 'Windows' && steps.cache-pdfium.outputs.cache-hit != 'true'
        shell: bash
        run: bash scarica-pdfium.sh win-x64
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: iqclock-${{ runner.os }}
          path: |
            target/release/iqclock
            target/release/iqclock.exe
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [build, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Crea la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv iqclock-Linux/iqclock iqclock-linux-x64
          mv iqclock-Windows/iqclock.exe iqclock-win-x64.exe
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes iqclock-linux-x64 iqclock-win-x64.exe
