[package]
name = "iqclock"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Alternativa minima a HP Click per stampanti HP DesignJet PostScript"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "system_fonts", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "tiff", "png"] }
imagesize = "0.15.0"
lopdf = "0.46.0"
pdfium-render = "0.9.4"
rfd = "0.17.2"
tiff = "0.11"

[features]
# Include pdfium nell'eseguibile (serve prima `scarica-pdfium.sh`); usata per le release.
pdfium-incluso = []

[build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = true
