[package]
name = "hpclock"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "tiff", "png"] }
imagesize = "0.15.0"
lopdf = "0.46.0"
rfd = "0.17.2"

[profile.release]
strip = true
